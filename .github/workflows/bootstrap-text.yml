name: Bootstrap academic website
on: workflow_dispatch
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct site
        shell: bash
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          git clone --depth 1 https://github.com/HugoBlox/hugo-theme-academic-cv.git "$tmpdir/theme"
          rsync -a --exclude=.git "$tmpdir/theme/" ./
          mkdir -p "$(dirname README.md)"
          printf '%s' '' | base64 -d > 'README.md'
          mkdir -p "$(dirname config/_default/hugo.yaml)"
          printf '%s' '' | base64 -d > 'config/_default/hugo.yaml'
          mkdir -p "$(dirname config/_default/menus.yaml)"
          printf '%s' '' | base64 -d > 'config/_default/menus.yaml'
          mkdir -p "$(dirname config/_default/params.yaml)"
          printf '%s' '' | base64 -d > 'config/_default/params.yaml'
          mkdir -p "$(dirname content/_index.md)"
          printf '%s' '' | base64 -d > 'content/_index.md'
          mkdir -p "$(dirname content/experience.md)"
          printf '%s' '' | base64 -d > 'content/experience.md'
          mkdir -p "$(dirname data/authors/me.yaml)"
          printf '%s' '' | base64 -d > 'data/authors/me.yaml'
          mkdir -p "$(dirname content/publications/cluster-states/index.md)"
          printf '%s' '' | base64 -d > 'content/publications/cluster-states/index.md'
          mkdir -p "$(dirname content/publications/local-observables/index.md)"
          printf '%s' '' | base64 -d > 'content/publications/local-observables/index.md'
          mkdir -p "$(dirname content/publications/partial-transpose-moments/index.md)"
          printf '%s' '' | base64 -d > 'content/publications/partial-transpose-moments/index.md'
          mkdir -p "$(dirname content/publications/surface-code-framework/index.md)"
          printf '%s' '' | base64 -d > 'content/publications/surface-code-framework/index.md'
          mkdir -p "$(dirname content/publications/tensor-network-vqa/index.md)"
          printf '%s' '' | base64 -d > 'content/publications/tensor-network-vqa/index.md'
          rm -f 'content/events/example/index.md'
          rm -f 'content/publications/conference-paper/cite.bib'
          rm -f 'content/publications/conference-paper/index.md'
          rm -f 'content/publications/journal-article/cite.bib'
          rm -f 'content/publications/journal-article/index.md'
          rm -f 'content/publications/preprint/index.md'
          rm -f '.github/workflows/bootstrap-text.yml'
      - name: Commit imported site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Junxiang Huang academic website"
          git push origin main
