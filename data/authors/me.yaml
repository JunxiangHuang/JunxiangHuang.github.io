    summary: |
      Conducting research in [Xiao Yuan’s group](http://qtheorist.site/members/xiao-yuan/) at the Center on Frontiers of Computing Studies. Research spans local and global observable estimation, partial-transpose moments, clustered quantum systems, tensor-network-assisted algorithms, and fault-tolerant resource estimation. I have participated in group research since April 2021.
