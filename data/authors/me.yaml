bio: |
  I am a PhD candidate at Peking University, advised by [Xiao Yuan](http://qtheorist.site/members/xiao-yuan/), working on quantum algorithms, quantum information, and fault-tolerant quantum computing. My research focuses on resource-efficient methods for estimating quantum observables and nonlinear state properties, tensor-network-assisted quantum algorithms, and quantum error correction. I expect to graduate in June 2027 and am interested in postdoctoral opportunities.

